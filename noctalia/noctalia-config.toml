[accessibility]
ui_scale = 0.90000000596046448

[bar.default]
center = []
concave_edge_corners = false
end = [ "tray", "battery", "volume", "ram", "temp", "clock" ]
font_family = "JetBrains Mono"
font_weight = 300
hover_highlight = false
margin_ends = 0
padding = 5
position = "bottom"
radius = 0
shadow = false
start = [ "workspaces" ]
widget_spacing = 10

[control_center]
width = 1000

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 807.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
font_family = "JetBrains Mono"
lang = "en"
popup_shadows = false

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_center"
    floating_layer = "top"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    directory = "/home/quincy/Pictures/Screenshots"
    show_cursor = true

    [shell.session]
    grid_columns = 5

    [shell.shadow]
    alpha = 0.0

[theme]
custom_palette = "wp10205936-autumn-mountains-4k-wallpapers-ts"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "foot", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "fastfetch" ]

[wallpaper.default]
path = "/home/quincy/Pictures/Wallpapers/wp10205936-autumn-mountains-4k-wallpapers.jpg"

[wallpaper.last]
path = "/home/quincy/Pictures/Wallpapers/wp10205936-autumn-mountains-4k-wallpapers.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/quincy/Pictures/Wallpapers/wp10205936-autumn-mountains-4k-wallpapers.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/quincy/Pictures/Wallpapers/wp10205936-autumn-mountains-4k-wallpapers.jpg"

[widget.battery]
display_mode = "none"

[widget.clock]
format = "| {:%H:%M}"

[widget.ram]
glyph = "minus-vertical"
visualization = "none"

[widget.temp]
glyph = "minus-vertical"
visualization = "none"

[widget.tray]
drawer = true

[widget.volume]
glyph = "minus-vertical"

[widget.workspaces]
empty_color = "outline"
font_scale = 1.1799999999999999
max_label_chars = 2
occupied_color = "hover"
style = "minimal"
urgent_color = "on_error"
